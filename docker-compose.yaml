name: tennis-mlflow

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflow-local}
      POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  mlflow:
    build:
      context: docker/mlflow
    environment:
      MLFLOW_DB_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflow-local}
      MLFLOW_DB_NAME: ${MLFLOW_POSTGRES_DB:-mlflow}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 30s

volumes:
  postgres-data:
  artifacts:

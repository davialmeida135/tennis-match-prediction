# Dagster instance configuration.
#
# Defaults are zero-setup: everything is stored in SQLite files inside
# dagster_home/storage/, so a fresh clone runs with `dagster dev`.
#
# `dagster.yaml` does NOT expand ${VAR} references, so MySQL credentials cannot
# be injected from the environment here. If you need MySQL (for example a shared
# deployment), keep this file out of version control and use the template at
# dagster_home/dagster.mysql.yaml.example instead.

storage:
  sqlite:
    base_dir: dagster_home/storage
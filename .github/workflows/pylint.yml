name: Checks

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run regression tests
        run: uv run pytest -q
      - name: Validate Dagster definitions
        run: >-
          uv run python -c "from dagster import Definitions;
          from tennis_match_prediction.pipelines.defs import defs;
          Definitions.validate_loadable(defs)"
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint with ruff
        run: uv run ruff check src tests

  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Analyse pipelines with pylint
        run: uv run pylint src/tennis_match_prediction/pipelines
